# The public stats endpoints can be slow or stale behind GitHub's image proxy
# and external caches. Render the SVGs in Actions, commit them here, and let the
# README point at files GitHub itself serves.
name: Streak stats

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&theme=react&hide_border=true&bg_color=0D1117
          path: assets/github-stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=8&layout=compact&theme=react&hide_border=true&bg_color=0D1117&card_width=445
          path: assets/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Generate WakaTime card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: wakatime
          options: username=${{ github.repository_owner }}&hide_border=true&theme=react&bg_color=0D1117
          path: assets/wakatime.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=black-ice&hide_border=true&stroke=0000&background=0D1117&ring=60D9FA&fire=60D9FA&currStreakLabel=60D9FA
          path: assets/streak-stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "chore: update profile stats assets"
          git push
